name: Qualidade

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar menu gerado e qualidade
        run: npm run check
