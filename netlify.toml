[[redirects]]
  from = "/"
  to = "/aboutMe.html"
  status = 200

[[redirects]]
  from = "/work.html"
  to = "/work.html"
  status = 200

[[redirects]]
  from = "/top3work"
  to = "/work.html"
  status = 301

[[redirects]]
  from = "/top3Work.html"
  to = "/work.html"
  status = 301

[[redirects]]
  from = "/study.html"
  to = "/study.html"
  status = 200

[[redirects]]
  from = "/contact.html"
  to = "/contact.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://unpkg.com; style-src 'self' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
